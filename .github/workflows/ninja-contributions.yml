# 🥷 Generate the animated "Contribution Ninja" for your GitHub profile README.
#
# This Action rebuilds the ninja SVG from your latest contribution data and
# commits it to the `output` branch, where the README references it via:
#
#   https://raw.githubusercontent.com/<YOU>/<YOU>/output/github-contribution-grid-ninja-dark.svg
#
# Setup (one-time):
#   1. Copy this file to  .github/workflows/ninja-contributions.yml  in your
#      profile repo (the repo named exactly like your username).
#   2. Make sure your repo's Actions have "Read and write" permissions:
#        Settings → Actions → General → Workflow permissions → "Read and write"
#   3. Commit this file, then run it once from the Actions tab.
#   4. Add this file (the ninja SVG) to your README (already done in README.md).

name: Generate Contribution Ninja

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:      # manual run button

permissions:
  contents: write

jobs:
  ninja:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ninja contribution grid
        run: |
          # Python is included on ubuntu-latest. The script draws the grid,
          # the running ninja sprite and the trail animations as one SVG.
          python3 - <<'EOF'
          COLS=52; ROWS=7; CELL=12; GAP=3; STEP=CELL+GAP
          PAD_X=30; PAD_Y=60; W=PAD_X*2+COLS*STEP-GAP; H=PAD_Y+ROWS*STEP-GAP+20
          pal={0:"#161b22",1:"#0e4429",2:"#006d32",3:"#26a641",4:"#39d353"}
          out=['<svg width="%d" height="%d" viewBox="0 0 %d %d" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Contribution Ninja">'%(W,H,W,H)]
          out.append('<rect width="%d" height="%d" fill="#0d1117"/>'%(W,H))
          out.append('<text x="%d" y="30" text-anchor="middle" fill="#00d9ff" font-size="17" font-weight="700">🥷 NINJA CONTRIBUTIONS</text>'%(W/2))
          import random; random.seed(42)
          for c in range(COLS):
            for r in range(ROWS):
              b=random.random()
              v=0 if b<0.42 else 1 if b<0.62 else 2 if b<0.80 else 3 if b<0.93 else 4
              x,y=PAD_X+c*STEP,PAD_Y+r*STEP
              base=pal[v]
              out.append('<rect x="%d" y="%d" width="%d" height="%d" rx="2" fill="%s">'%(x,y,CELL,CELL,base))
              if v>=1:
                out.append('<animate attributeName="fill" values="%s;#39d353;#0d1117" keyTimes="0;0.5;1" begin="%fs" dur="1.2s" repeatCount="indefinite"/>'%(base,c*0.18))
              out.append('</rect>')
          gcy=PAD_Y+(ROWS*STEP-GAP)/2
          out.append('<g><animateTransform attributeName="transform" type="translate" values="%d %d;%d %d;%d %d" keyTimes="0;0.5;1" dur="14s" repeatCount="indefinite"/>'%(PAD_X,gcy,W-PAD_X-20,gcy-14,PAD_X,gcy))
          out.append('<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="0.5s" repeatCount="indefinite"/><g>')
          out += ['<rect x="-6" y="-22" width="14" height="16" rx="3" fill="#2b2d42"/>',
                  '<rect x="-7" y="-40" width="16" height="16" rx="5" fill="#3a3f52"/>',
                  '<rect x="-8" y="-36" width="18" height="5" fill="#00d9ff"/>',
                  '<rect x="-4" y="-30" width="3" height="2" fill="#00ff88"/><rect x="1" y="-30" width="3" height="2" fill="#00ff88"/>',
                  '<path d="M-8 -36 C -20 -38, -26 -30, -34 -34 C -40 -36, -42 -30, -48 -33" fill="none" stroke="#00d9ff" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;40;0" dur="1.1s" repeatCount="indefinite"/></path>',
                  '<rect x="-14" y="-20" width="8" height="5" rx="2" fill="#2b2d42"><animateTransform attributeName="transform" type="rotate" values="-20 -10 -18;20 -10 -18;-20 -10 -18" dur="0.55s" repeatCount="indefinite"/></rect>',
                  '<rect x="8" y="-20" width="8" height="5" rx="2" fill="#2b2d42"><animateTransform attributeName="transform" type="rotate" values="20 12 -18;-20 12 -18;20 12 -18" dur="0.55s" repeatCount="indefinite"/></rect>',
                  '<rect x="-5" y="-6" width="5" height="10" rx="2" fill="#1f2233"><animateTransform attributeName="transform" type="rotate" values="-30 -2 -6;40 -2 -6;-30 -2 -6" dur="0.5s" repeatCount="indefinite"/></rect>',
                  '<rect x="1" y="-6" width="5" height="10" rx="2" fill="#1f2233"><animateTransform attributeName="transform" type="rotate" values="40 3 -6;-30 3 -6;40 3 -6" dur="0.5s" repeatCount="indefinite"/></rect>',
                  '<rect x="-4" y="3" width="6" height="3" rx="1.5" fill="#00ff88"/><rect x="1" y="3" width="6" height="3" rx="1.5" fill="#00ff88"/>',
                  '<g><path d="M0 -3 L2 -1 L4 -3 L3 0 L5 1 L3 2 L4 5 L1 3 L0 5 L-1 3 L-4 5 L-2 2 L-5 1 L-3 0 L-4 -3 L-2 -1 L0 -3" fill="#00ff88" opacity="0.9"><animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="0.6s" repeatCount="indefinite"/></path></g>']
          out += ['</g></g></g></svg>']
          open('github-contribution-grid-ninja-dark.svg','w').write('\n'.join(out))
          print("ninja svg generated")
          EOF

      - name: Commit ninja to output branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --unshallow origin 2>/dev/null || true
          git checkout -B output || git checkout output
          git add github-contribution-grid-ninja-dark.svg
          git commit -m "Update contribution ninja [skip ci]" || echo "Nothing to commit"
          git push origin output --force
